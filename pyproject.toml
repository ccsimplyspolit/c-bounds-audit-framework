[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "c-bounds-audit-framework"
version = "1.0.0"
description = "Lightweight automated static audit framework for C/C++ memory bounds, struct field overflows, and unsafe pointer arithmetic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Serhii Shunko", email = "cc.simply.spolit@gmail.com" }
]
keywords = ["c", "cpp", "security", "static-analysis", "bounds-checking", "pointer-arithmetic", "buffer-overflow", "network-parsers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Topic :: Security",
]

[project.scripts]
c-bounds-auditor = "cbounds.cli:main"

[project.urls]
Homepage = "https://github.com/ccsimplyspolit/c-bounds-audit-framework"
Issues = "https://github.com/ccsimplyspolit/c-bounds-audit-framework/issues"
Repository = "https://github.com/ccsimplyspolit/c-bounds-audit-framework.git"

[tool.setuptools.packages.find]
include = ["cbounds*"]
